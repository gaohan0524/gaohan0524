name: Generate Snake Animation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            .github/assets/snake.svg?color_snake=#165DFF&color_dots=#ebedf0,#b3e5fc,#81d4fa,#4fc3f7,#29b6f6
            .github/assets/snake-dark.svg?color_snake=#165DFF&color_dots=#161b22,#0b3d91,#1565c0,#1e88e5,#42a5f5

      - name: Force commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 无条件强制覆盖文件
          git add .github/assets/ --force
          git commit -m "force: update snake heatmap [skip ci]" || true
          git push origin HEAD:main --force
